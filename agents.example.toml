# Registre des agents. Copie ce fichier en agents.toml et adapte-le à ton poste (agents.toml n'est pas versionné).
# Les dossiers relatifs le sont au dossier de ce fichier : par défaut, les agents sont clonés à côté du manager.
#
# Champs d'un agent :
#   nom       identifiant (minuscules, chiffres, tirets)
#   titre     nom affiché
#   dossier   copie locale du dépôt de l'agent (avec son venv)
#   port      port de son IHM Streamlit (8500 = manager, 8499 = superviseur : réservés)
#   mode      "auto" (lancé avec le manager) ou "demande" (lancé depuis l'onglet Agents)
#   commande  facultatif ; par défaut : {python} -m streamlit run app.py sur {port}, en 127.0.0.1
#             ({python} = venv/ ou .venv/ de l'agent, {port} = son port, {dossier} = son dossier)
#   domaine   ce que l'agent sait faire : lu par le routeur du manager (lot 4)
#   mcp       commande de son serveur MCP en lecture seule, interrogé par l'assistant du manager
#   secrets   secrets de config/.env transmis au lancement (moindre privilège ; motifs acceptés, ex. DB_PASSWORD_*).
#             Les accès non secrets (adresses, e-mail Jira…) et SAVOYE_CONFIG_DIR sont transmis à tous.
#
# Documentation Odatio : ODATIO_DOC_* (non secrets) est transmis à tous ; la lire demande BITBUCKET_HTTP_TOKEN
# (lecture). Un agent la consulte en déclarant le serveur MCP partagé du manager dans ses sessions Claude :
#   {python} {dossier}/../agent-manager-savoye/mcp_doc_odatio.py   (env : ODATIO_DOC_*, BITBUCKET_URL et le jeton)

[manager]
port = 8500
port_superviseur = 8499

[[agents]]
nom = "scrum-master"
titre = "Scrum Master"
dossier = "../agent-scrum-master"
port = 8501
mode = "auto"
domaine = """Cycle de vie d'un ticket Jira Odatio : intégration du besoin, analyse et cadrage, chiffrage, découpage
d'épopée, patch Git et release note, tests Cucumber (génération, exécution Jenkins, correction, livraison)."""
mcp = ["{python}", "{dossier}/../agent-manager-savoye/mcp_lecture.py"]   # lecteur repris par le manager
secrets = ["ANTHROPIC_API_KEY", "JIRA_API_TOKEN", "JIRA_READ_API_TOKEN", "BITBUCKET_HTTP_TOKEN",
           "BITBUCKET_WRITE_TOKEN", "JENKINS_API_TOKEN", "GROUNDCOVER_API_KEY"]

[[agents]]
nom = "odatio"
titre = "Agent fonctionnel Odatio"
dossier = "../agent-odatio"
port = 8502
mode = "auto"
domaine = """Questions fonctionnelles sur une application Odatio (calculs, blocages, règles), réponses prouvées par
les sources, la base en lecture seule et les logs ; préparation des tests d'un ticket ; fichiers d'interface de
test (commande « à l'identique »…)."""
mcp = ["{python}", "{dossier}/mcp_server.py", "--manager"]
secrets = ["ANTHROPIC_API_KEY", "JIRA_API_TOKEN", "BITBUCKET_HTTP_TOKEN", "GROUNDCOVER_API_KEY",
           "DB_PASSWORD_*", "APP_PASSWORD_*", "SSH_PASSWORD_*"]   # jamais de jeton d'écriture

[[agents]]
nom = "dev-tool"
titre = "Outillage de développement"
dossier = "../agent-dev-tool-savoye"
port = 8503
mode = "demande"
# API locale du mode autonome (boucle de correction d'agent-cucumber) ouverte au lancement, même sans navigateur
commande = ["{python}", "-m", "agent_dev.lancer", "--server.port", "{port}", "--server.address", "127.0.0.1",
            "--server.headless", "true"]
domaine = """Évolution du code des agents (dont le manager) : analyse, plan, développement dans un chantier
isolé, PR ; extraction et comparaison des prompts et outils d'un agent."""
mcp = []
secrets = ["ANTHROPIC_API_KEY"]

[[agents]]
nom = "projets"
titre = "Projets et connexions"
dossier = "../agent-projets"
port = 8504
mode = "auto"
# Venv partagé d'agent-scrum-master pendant le chantier (agent-socle installé en éditable)
commande = ["{dossier}/../agent-scrum-master/venv/Scripts/python.exe", "-m", "streamlit", "run", "app.py",
            "--server.port", "{port}", "--server.address", "127.0.0.1", "--server.headless", "true"]
domaine = """Registre des projets (projets Cucumber et applications du manager, en lecture), tests de
connexion (base, groundcover, MCP, répertoire partagé) ; API locale en lecture (8512)."""
mcp = []
secrets = []

[[agents]]
nom = "integration"
titre = "Intégration du besoin"
dossier = "../agent-integration"
port = 8505
mode = "auto"
# Venv partagé d'agent-scrum-master pendant le chantier (agent-socle installé en éditable)
commande = ["{dossier}/../agent-scrum-master/venv/Scripts/python.exe", "-m", "streamlit", "run", "app.py",
            "--server.port", "{port}", "--server.address", "127.0.0.1", "--server.headless", "true"]
domaine = """Reformulation du besoin d'un ticket Jira et questions ouvertes publiées dans sa description,
puis cadrage complété par les réponses."""
mcp = []
secrets = ["ANTHROPIC_API_KEY", "JIRA_API_TOKEN", "JIRA_READ_API_TOKEN", "BITBUCKET_HTTP_TOKEN"]   # lecture : doc Odatio

[[agents]]
nom = "lancement"
titre = "Lancement d'un ticket"
dossier = "../agent-lancement"
port = 8506
mode = "auto"
# Venv partagé d'agent-scrum-master pendant le chantier (agent-socle installé en éditable)
commande = ["{dossier}/../agent-scrum-master/venv/Scripts/python.exe", "-m", "streamlit", "run", "app.py",
            "--server.port", "{port}", "--server.address", "127.0.0.1", "--server.headless", "true"]
domaine = """Analyse et cadrage d'un ticket, chiffrage, révision, découpage d'épopée, validation et
publication dans Jira, patch Git et release note."""
mcp = []
secrets = ["ANTHROPIC_API_KEY", "JIRA_API_TOKEN", "JIRA_READ_API_TOKEN", "BITBUCKET_HTTP_TOKEN", "GROUNDCOVER_API_KEY"]

[[agents]]
nom = "cucumber"
titre = "Tests Cucumber"
dossier = "../agent-cucumber"
port = 8507
mode = "auto"
# Venv partagé d'agent-scrum-master pendant le chantier (agent-socle installé en éditable)
commande = ["{dossier}/../agent-scrum-master/venv/Scripts/python.exe", "-m", "streamlit", "run", "app.py",
            "--server.port", "{port}", "--server.address", "127.0.0.1", "--server.headless", "true"]
domaine = """Tests Cucumber d'un client : génération, exécution Jenkins, correction, livraison ;
post-merge et remise de configuration."""
mcp = []
secrets = ["ANTHROPIC_API_KEY", "JIRA_API_TOKEN", "JIRA_READ_API_TOKEN", "BITBUCKET_HTTP_TOKEN", "BITBUCKET_WRITE_TOKEN", "JENKINS_API_TOKEN", "GROUNDCOVER_API_KEY"]

[[agents]]
nom = "revue-pr"
titre = "Revue de PR"
dossier = "../agent-revue-pr"
port = 8508
mode = "auto"
# Venv partagé d'agent-scrum-master pendant le chantier (agent-socle installé en éditable)
commande = ["{dossier}/../agent-scrum-master/venv/Scripts/python.exe", "-m", "streamlit", "run", "app.py",
            "--server.port", "{port}", "--server.address", "127.0.0.1", "--server.headless", "true"]
domaine = """Relecture assistée des pull requests Bitbucket d'une fonctionnalité (lecture seule)."""
mcp = []
secrets = ["ANTHROPIC_API_KEY", "JIRA_READ_API_TOKEN", "BITBUCKET_HTTP_TOKEN"]
