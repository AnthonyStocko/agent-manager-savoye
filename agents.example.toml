# Registre des agents. Copie ce fichier en agents.toml et adapte-le à ton poste (agents.toml n'est pas versionné).
# Les dossiers relatifs le sont au dossier de ce fichier : par défaut, les agents sont clonés à côté du manager.
#
# Champs d'un agent :
#   nom       identifiant (minuscules, chiffres, tirets)
#   titre     nom affiché
#   dossier   copie locale du dépôt de l'agent (avec son venv)
#   port      port de son IHM Streamlit (8500 = manager, 8499 = superviseur : réservés)
#   mode      "auto" (lancé avec le manager) ou "demande" (lancé depuis l'onglet Agents)
#   commande  facultatif ; par défaut : {python} -m streamlit run app.py sur {port}, en 127.0.0.1
#             ({python} = venv/ ou .venv/ de l'agent, {port} = son port, {dossier} = son dossier)
#   domaine   ce que l'agent sait faire : lu par le routeur du manager (lot 4)
#   mcp       commande de son serveur MCP en lecture seule, interrogé par l'assistant du manager
#   secrets   secrets de config/.env transmis au lancement (moindre privilège ; motifs acceptés, ex. DB_PASSWORD_*).
#             Les accès non secrets (adresses, e-mail Jira…) et SAVOYE_CONFIG_DIR sont transmis à tous.

[manager]
port = 8500
port_superviseur = 8499

[[agents]]
nom = "scrum-master"
titre = "Scrum Master"
dossier = "../agent-scrum-master"
port = 8501
mode = "auto"
domaine = """Cycle de vie d'un ticket Jira Odatio : intégration du besoin, analyse et cadrage, chiffrage, découpage
d'épopée, patch Git et release note, tests Cucumber (génération, exécution Jenkins, correction, livraison)."""
mcp = ["{python}", "{dossier}/mcp_lecture.py"]
secrets = ["ANTHROPIC_API_KEY", "JIRA_API_TOKEN", "JIRA_READ_API_TOKEN", "BITBUCKET_HTTP_TOKEN",
           "BITBUCKET_WRITE_TOKEN", "JENKINS_API_TOKEN", "GROUNDCOVER_API_KEY"]

[[agents]]
nom = "odatio"
titre = "Agent fonctionnel Odatio"
dossier = "../agent-odatio"
port = 8502
mode = "auto"
domaine = """Questions fonctionnelles sur une application Odatio (calculs, blocages, règles), réponses prouvées par
les sources, la base en lecture seule et les logs ; préparation des tests d'un ticket ; fichiers d'interface de
test (commande « à l'identique »…)."""
mcp = ["{python}", "{dossier}/mcp_server.py", "--manager"]
secrets = ["ANTHROPIC_API_KEY", "JIRA_API_TOKEN", "BITBUCKET_HTTP_TOKEN", "GROUNDCOVER_API_KEY",
           "DB_PASSWORD_*", "APP_PASSWORD_*", "SSH_PASSWORD_*"]   # jamais de jeton d'écriture

[[agents]]
nom = "dev-tool"
titre = "Outillage de développement"
dossier = "../agent-dev-tool-savoye"
port = 8503
mode = "demande"
domaine = """Évolution du code des agents (dont le manager) : analyse, plan, développement dans un chantier
isolé, PR ; extraction et comparaison des prompts et outils d'un agent."""
mcp = []
secrets = ["ANTHROPIC_API_KEY"]
